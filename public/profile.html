<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Record — firstdb</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink:#12181f; --panel:#1a222c; --panel-light:#212b37; --line:#2c3844;
    --amber:#e8a33d; --amber-dim:#8a6a34; --text:#e9edf1; --text-dim:#8b98a5;
    --good:#5fb488; --bad:#c9584f; --overlay:rgba(10,14,18,0.7);
  }
  [data-theme="light"]{
    --ink:#f5f3ee; --panel:#ffffff; --panel-light:#f0ede6; --line:#e1dcd0;
    --amber:#b5761f; --amber-dim:#e3c088; --text:#20241f; --text-dim:#6b6558;
    --good:#3d8f64; --bad:#b5473d; --overlay:rgba(245,243,238,0.7);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; transition:background .2s ease, color .2s ease;
  }
  .wrap{max-width:820px; margin:0 auto; padding:40px 28px 80px;}

  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:28px; flex-wrap:wrap; gap:14px;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:8px; color:var(--text-dim);
    text-decoration:none; font-family:'IBM Plex Mono',monospace; font-size:13px;
    transition:color .15s ease;
  }
  .back-link:hover{ color:var(--amber); }
  .topbar-right{ display:flex; align-items:center; gap:12px; }
  .role-badge{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; padding:5px 10px; border-radius:999px;
    border:1px solid var(--amber-dim); color:var(--amber); background:rgba(232,163,61,0.1);
  }
  .theme-toggle{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text); transition:border-color .15s ease;
  }
  .theme-toggle:hover{border-color:var(--amber-dim);}

  @keyframes cardIn{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    overflow:hidden; animation:cardIn .45s cubic-bezier(0.16,1,0.3,1);
  }
  .card-top{
    padding:34px 34px 28px; display:flex; align-items:center; gap:22px;
    background:var(--panel-light); border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .photo, .photo-box{
    width:88px; height:88px; border-radius:20px; flex:none; object-fit:cover;
    background:linear-gradient(135deg, var(--amber), #c9822a); color:#1a1305;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-size:34px; font-weight:700;
  }
  .photo-box{
    background:var(--ink); border:1.5px dashed var(--line); color:var(--text-dim);
    cursor:pointer; font-size:11px; font-family:'IBM Plex Mono',monospace;
    text-align:center; padding:8px; flex-direction:column; gap:5px; overflow:hidden;
  }
  .photo-box:hover{ border-color:var(--amber-dim); color:var(--amber); }
  .photo-box img{ width:100%; height:100%; object-fit:cover; border-radius:18px; }
  .who{ flex:1; min-width:200px; }
  .who h1{
    font-family:'Space Grotesk',sans-serif; font-size:28px; font-weight:700;
    margin:0 0 8px; letter-spacing:-0.01em;
  }
  .who .meta{
    font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text-dim);
    display:flex; gap:14px; flex-wrap:wrap; align-items:center;
  }
  .pill{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    padding:3px 10px; border-radius:999px; border:1px solid var(--amber-dim); color:var(--amber);
  }
  .card-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  .btn{
    font-family:'Inter',sans-serif; font-size:14px; font-weight:600; border-radius:8px;
    padding:0 16px; cursor:pointer; border:1px solid transparent; transition:all .15s ease;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap; height:40px;
  }
  .btn-primary{ background:var(--amber); color:#1a1305; }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.6; cursor:not-allowed;}
  .btn-ghost{ background:var(--panel); color:var(--text); border-color:var(--line); }
  [data-theme="light"] .btn-ghost{ background:var(--panel-light); }
  .btn-ghost:hover{border-color:var(--amber-dim);}
  .btn-danger{ background:transparent; color:var(--bad); border-color:transparent; }
  .btn-danger:hover{background:rgba(201,88,79,0.12);}
  .btn-destroy{ background:var(--bad); color:#fff; }
  .btn-destroy:hover{filter:brightness(1.1);}

  .grid{ display:grid; grid-template-columns:repeat(2, 1fr); }
  .cell{ padding:20px 34px; border-bottom:1px solid var(--line); }
  .cell:nth-child(odd){ border-right:1px solid var(--line); }
  .cell label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:11px;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:8px;
  }
  .cell .value{ font-size:15.5px; word-break:break-word; }
  .cell .value.empty{ color:var(--text-dim); font-style:italic; font-size:14px; }
  .cell input, .cell select{
    width:100%; background:var(--ink); border:1.5px solid var(--line); border-radius:8px;
    padding:10px 12px; color:var(--text); font-family:'Inter',sans-serif; font-size:14.5px; outline:none;
  }
  .cell input:focus, .cell select:focus{ border-color:var(--amber-dim); }
  .cell input:disabled, .cell select:disabled{ opacity:.6; cursor:not-allowed; }
  .locked-note{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-dim); margin-top:6px;
  }

  .footnote{
    padding:18px 34px; font-family:'IBM Plex Mono',monospace; font-size:12px;
    color:var(--text-dim); display:flex; align-items:center; gap:9px; line-height:1.6;
  }
  .footnote svg{ flex:none; color:var(--amber); }

  .state{
    padding:70px 20px; text-align:center; color:var(--text-dim);
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
  }
  .state svg{ margin-bottom:14px; opacity:.5; }
  .state h2{ font-family:'Space Grotesk',sans-serif; color:var(--text); font-size:20px; margin:0 0 8px; }

  .overlay{
    position:fixed; inset:0; background:var(--overlay); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:32px; width:100%; max-width:430px; box-shadow:0 30px 70px rgba(0,0,0,0.45);
  }
  .modal h2{ font-family:'Space Grotesk',sans-serif; font-size:21px; margin:0 0 6px; }
  .modal p.sub{ color:var(--text-dim); font-size:13.5px; margin:0 0 22px; line-height:1.55; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:13px 20px; font-size:14px; box-shadow:0 14px 34px rgba(0,0,0,0.35);
    display:flex; align-items:center; gap:9px; opacity:0;
    transition:all .3s cubic-bezier(0.16,1,0.3,1); z-index:200;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }
  .toast.good{ border-color:var(--good); color:var(--good); }
  .toast.bad{ border-color:var(--bad); color:var(--bad); }

  @media (max-width:640px){
    .wrap{ padding:28px 18px 60px; }
    .card-top{ padding:26px 20px; }
    .grid{ grid-template-columns:1fr; }
    .cell{ padding:16px 20px; }
    .cell:nth-child(odd){ border-right:none; }
    .footnote{ padding:16px 20px; }
    .who h1{ font-size:23px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-link" href="directory.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to directory
    </a>
    <div class="topbar-right">
      <span class="role-badge" id="roleBadge">—</span>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>
  </div>

  <div id="host">
    <div class="state"><p>Loading record…</p></div>
  </div>
</div>

<!-- delete confirm -->
<div class="overlay" id="deleteOverlay">
  <div class="modal">
    <h2>Delete this record?</h2>
    <p class="sub" id="deleteSub">This permanently removes the student from the directory.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="deleteCancelBtn">Cancel</button>
      <button class="btn btn-destroy" id="deleteConfirmBtn">Delete record</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastText"></span></div>

<script>
  const API_URL = window.location.origin + '/api/items';
  const personId = new URLSearchParams(window.location.search).get('id');

  const token = localStorage.getItem('token');
  const role = localStorage.getItem('role');
  const myDept = localStorage.getItem('dept') || '';

  // Students get their own dedicated page; everyone else needs a token.
  if (!token) {
    window.location.replace('login.html');
  } else if (role === 'student') {
    window.location.replace('student.html');
  }

  const isAdmin = role === 'admin';
  const isTeacher = role === 'teacher';
  const canEdit = isAdmin || isTeacher;
  const canDelete = isAdmin;

  document.getElementById('roleBadge').textContent = isAdmin ? 'Admin' : 'Teacher · ' + myDept;

  const authHeaders = () => ({ 'Authorization': 'Bearer ' + token });

  function forceLogout(){
    localStorage.clear();
    window.location.replace('login.html');
  }

  function toast(message, kind){
    const el = document.getElementById('toast');
    document.getElementById('toastText').textContent = message;
    el.className = 'toast show ' + (kind || '');
    setTimeout(() => { el.className = 'toast ' + (kind || ''); }, 2600);
  }

  // theme
  if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme','light');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if (isLight) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme','dark'); }
    else { document.documentElement.setAttribute('data-theme','light'); localStorage.setItem('theme','light'); }
  });

  const FIELDS = [
    ['name','Full name'],
    ['father_name',"Father's name"],
    ['roll_no','Roll no'],
    ['class','Class'],
    ['batch','Batch'],
    ['dept','Department'],
    ['email','Email'],
    ['contact_no','Contact no']
  ];

  let person = null;
  let photoData = null;

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function errorState(title, message){
    document.getElementById('host').innerHTML = `
      <div class="state">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <h2>${escapeHtml(title)}</h2>
        <p>${escapeHtml(message)}</p>
      </div>`;
  }

  async function loadPerson(){
    try{
      const res = await fetch(API_URL + '/' + personId, { headers: authHeaders() });
      if (res.status === 401) return forceLogout();
      const data = await res.json();
      if (res.status === 403) return errorState('Not your department', data.error || 'You can only open your own department records.');
      if (!res.ok) return errorState('Record not found', data.error || 'That record does not exist.');
      person = data;
      renderView();
    }catch(err){
      errorState('Could not reach the server', err.message);
    }
  }

  function headerBlock(editing){
    const initial = (person.name || '?').charAt(0).toUpperCase();
    const photo = editing
      ? `<div class="photo-box" id="photoBox">
           ${photoData || person.photo ? `<img src="${escapeHtml(photoData || person.photo)}" alt="">`
             : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12" r="3"/></svg><span>Photo</span>`}
         </div>
         <input type="file" id="photoInput" accept="image/*" style="display:none;">`
      : (person.photo
          ? `<img class="photo" src="${escapeHtml(person.photo)}" alt="">`
          : `<div class="photo">${escapeHtml(initial)}</div>`);

    return `
      <div class="card-top">
        ${photo}
        <div class="who">
          <h1>${escapeHtml(person.name || 'Unnamed')}</h1>
          <div class="meta">
            <span class="pill">${escapeHtml(person.dept || '—')}</span>
            <span>Id ${escapeHtml(person.id)}</span>
            <span>${escapeHtml(person.roll_no || 'No roll no')}</span>
          </div>
        </div>
        <div class="card-actions" id="cardActions"></div>
      </div>`;
  }

  function renderView(){
    document.getElementById('host').innerHTML = `
      <div class="card">
        ${headerBlock(false)}
        <div class="grid">
          ${FIELDS.map(([key,label]) => {
            const v = person[key];
            const filled = v !== null && v !== undefined && String(v).trim() !== '';
            return `
              <div class="cell">
                <label>${label}</label>
                <div class="value ${filled ? '' : 'empty'}">${filled ? escapeHtml(v) : 'Not on record'}</div>
              </div>`;
          }).join('')}
        </div>
        ${isTeacher ? `
          <div class="footnote">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
            You can edit ${escapeHtml(myDept)} students but only an admin can delete a record.
          </div>` : ''}
      </div>`;

    const actions = document.getElementById('cardActions');
    if (canEdit) {
      actions.insertAdjacentHTML('beforeend', `
        <button class="btn btn-ghost" id="editBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
          Edit
        </button>`);
      document.getElementById('editBtn').addEventListener('click', renderEdit);
    }
    if (canDelete) {
      actions.insertAdjacentHTML('beforeend', `
        <button class="btn btn-danger" id="deleteBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
          Delete
        </button>`);
      document.getElementById('deleteBtn').addEventListener('click', openDelete);
    }
  }

  function renderEdit(){
    document.getElementById('host').innerHTML = `
      <div class="card">
        ${headerBlock(true)}
        <div class="grid">
          ${FIELDS.map(([key,label]) => {
            // Teachers cannot move a student out of their own department.
            const lockDept = key === 'dept' && isTeacher;
            return `
              <div class="cell">
                <label>${label}</label>
                <input id="field_${key}" value="${escapeHtml(person[key] ?? '')}" ${lockDept ? 'disabled' : ''}>
                ${lockDept ? '<p class="locked-note">Locked to your department</p>' : ''}
              </div>`;
          }).join('')}
        </div>
        <div class="footnote">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          Click the photo box to attach a picture (under 1.5 MB).
        </div>
      </div>`;

    document.getElementById('cardActions').innerHTML = `
      <button class="btn btn-ghost" id="cancelEditBtn">Cancel</button>
      <button class="btn btn-primary" id="saveEditBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        Save changes
      </button>`;

    document.getElementById('cancelEditBtn').addEventListener('click', () => { photoData = null; renderView(); });
    document.getElementById('saveEditBtn').addEventListener('click', handleSave);

    const photoBox = document.getElementById('photoBox');
    const photoInput = document.getElementById('photoInput');
    photoBox.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', handlePhotoSelect);
  }

  function handlePhotoSelect(e){
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 1.5 * 1024 * 1024) return toast('Photo must be under 1.5 MB', 'bad');
    const reader = new FileReader();
    reader.onload = () => {
      photoData = reader.result;
      document.getElementById('photoBox').innerHTML = `<img src="${photoData}" alt="">`;
    };
    reader.readAsDataURL(file);
  }

  async function handleSave(){
    const btn = document.getElementById('saveEditBtn');
    btn.disabled = true;

    const payload = { photo: photoData || person.photo || null };
    FIELDS.forEach(([key]) => {
      const input = document.getElementById('field_' + key);
      payload[key] = input.disabled ? person[key] : input.value.trim();
    });

    try{
      const res = await fetch(API_URL + '/' + personId, {
        method: 'PUT',
        headers: { 'Content-Type':'application/json', ...authHeaders() },
        body: JSON.stringify(payload)
      });
      if (res.status === 401) return forceLogout();
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not save');
      person = data;
      photoData = null;
      renderView();
      toast('Changes saved', 'good');
    }catch(err){
      toast(err.message, 'bad');
      btn.disabled = false;
    }
  }

  // ---------- delete (admin only) ----------
  const deleteOverlay = document.getElementById('deleteOverlay');
  function openDelete(){
    document.getElementById('deleteSub').textContent =
      'This permanently removes ' + (person.name || 'this student') + ' from the directory.';
    deleteOverlay.classList.add('open');
  }
  document.getElementById('deleteCancelBtn').addEventListener('click', () => deleteOverlay.classList.remove('open'));

  document.getElementById('deleteConfirmBtn').addEventListener('click', async () => {
    const btn = document.getElementById('deleteConfirmBtn');
    btn.disabled = true;
    try{
      const res = await fetch(API_URL + '/' + personId, { method:'DELETE', headers: authHeaders() });
      if (res.status === 401) return forceLogout();
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not delete');
      window.location.href = 'directory.html';
    }catch(err){
      deleteOverlay.classList.remove('open');
      toast(err.message, 'bad');
      btn.disabled = false;
    }
  });

  loadPerson();
</script>
</body>
</html>
